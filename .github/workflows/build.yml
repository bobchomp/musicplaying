name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore src/MusicDisplay/MusicDisplay.csproj

      - name: Build
        run: dotnet build src/MusicDisplay/MusicDisplay.csproj -c Release --no-restore

      - name: Publish self-contained exe
        run: >
          dotnet publish src/MusicDisplay/MusicDisplay.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDisplay-win-x64
          path: publish/MusicDisplay.exe
          if-no-files-found: error
